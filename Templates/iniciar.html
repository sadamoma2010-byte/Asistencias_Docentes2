<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - Asistencia Docente</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#dcfce7] via-[#f0fdf4] to-[#dcfce7] flex items-center justify-center p-4 relative selection:bg-emerald-200">

  <!-- Botón de Retroceso hacia la Pantalla Principal (Index) -->
  <a href="../index.html" class="absolute top-6 left-6 p-2.5 text-gray-600 hover:text-emerald-700 bg-white/70 hover:bg-white rounded-full shadow-sm border border-gray-200 transition flex items-center gap-2 text-xs font-medium" aria-label="Volver al inicio">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    <span class="hidden sm:inline">Volver</span>
  </a>

  <!-- Tarjeta de Iniciar Sesión -->
  <main class="w-full max-w-sm bg-white/80 backdrop-blur-md p-7 rounded-3xl border border-white/80 shadow-xl shadow-emerald-950/5">

    <!-- Encabezado con Icono -->
    <div class="flex items-center gap-3 mb-6">
      <div class="bg-emerald-600 text-white p-2.5 rounded-xl shadow-sm shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 15l2 2 4-4" />
        </svg>
      </div>
      <div>
        <h1 class="text-base font-bold text-gray-900 leading-tight">Iniciar sesión</h1>
        <p class="text-xs text-gray-500 mt-0.5">Accede a tu panel de asistencia</p>
      </div>
    </div>

    <!-- Mensaje de Alerta / Error -->
    <div id="alert-box" class="hidden mb-4 p-3 rounded-xl text-xs font-medium border"></div>

    <!-- Formulario con Validación AJAX -->
    <form id="login-form" class="space-y-4">

      <!-- Email -->
      <div>
        <label for="email" class="block text-xs font-medium text-gray-700 mb-1">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required 
          placeholder="docente@ejemplo.com"
          class="w-full px-3 py-2 bg-white/70 border border-gray-200 rounded-xl text-xs text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
        />
      </div>

      <!-- Contraseña -->
      <div>
        <label for="password" class="block text-xs font-medium text-gray-700 mb-1">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          placeholder="••••••••"
          class="w-full px-3 py-2 bg-white/70 border border-gray-200 rounded-xl text-xs text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
        />
      </div>

      <!-- Botón Entrar -->
      <button 
        type="submit" 
        id="btn-submit"
        class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-medium py-2.5 px-4 rounded-full text-xs transition shadow-md shadow-emerald-600/20 mt-2 flex items-center justify-center gap-2"
      >
        <span>Entrar</span>
      </button>

    </form>

    <!-- Separador 'o' -->
    <div class="relative my-4 flex items-center justify-center">
      <div class="border-t border-gray-200 w-full"></div>
      <span class="absolute bg-white/90 px-1.5 text-[10px] text-gray-400 rounded-full border border-gray-200">o</span>
    </div>

  <!-- Lógica de Autenticación en JavaScript -->
  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alert-box');
      const btnSubmit = document.getElementById('btn-submit');

      // Ocultar alertas previas y deshabilitar el botón
      alertBox.classList.add('hidden');
      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Verificando...';

      try {
        const response = await fetch('/iniciar', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: email, password: password })
        });

        const data = await response.json();

        if (response.ok && data.status === 'success') {
          // Mostrar mensaje de éxito y redireccionar
          alertBox.className = "mb-4 p-3 rounded-xl text-xs font-medium bg-emerald-100 border-emerald-300 text-emerald-800 block";
          alertBox.innerText = "✅ Credenciales válidas. Redireccionando...";
          
          setTimeout(() => {
            window.location.href = data.redirect || '/dashboard';
          }, 1000);
        } else {
          // Credenciales incorrectas o usuario no encontrado
          alertBox.className = "mb-4 p-3 rounded-xl text-xs font-medium bg-red-100 border-red-300 text-red-800 block";
          alertBox.innerText = `❌ ${data.message || 'Usuario o contraseña incorrectos'}`;
          btnSubmit.disabled = false;
          btnSubmit.innerText = 'Entrar';
        }
      } catch (error) {
        console.error('Error de autenticación:', error);
        alertBox.className = "mb-4 p-3 rounded-xl text-xs font-medium bg-red-100 border-red-300 text-red-800 block";
        alertBox.innerText = '❌ Error al conectar con el servidor.';
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Entrar';
      }
    });
  </script>

</body>
</html>
