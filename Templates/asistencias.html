<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia Docente - Historial</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at bottom right, #c1e6ce 0%, #dcf0e2 40%, #f4fbf6 100%);
            margin: 0;
            padding: 0;
        }
        .card-shadow {
            box-shadow: 0 10px 40px -10px rgba(15, 130, 65, 0.08);
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">

    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="w-[260px] bg-white/60 backdrop-blur-md h-full flex flex-col justify-between border-r border-white/40 shadow-sm z-10">
        <div class="px-6 py-8">
            <!-- Logo -->
            <div class="flex items-center gap-3 mb-10 pl-2">
                <div class="bg-gray-800 p-2 rounded-lg text-white">
                    <i class="ph-fill ph-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h2 class="font-bold text-sm leading-tight text-gray-900">Asistencia Docente</h2>
                    <p class="text-[10px] text-gray-500 font-medium">IED Los Laureles</p>
                </div>
            </div>

            <!-- Menú de Navegación -->
            <nav class="flex flex-col gap-2">
                <a href="#" class="flex items-center gap-3 text-gray-600 hover:bg-white/60 px-4 py-3 rounded-2xl font-medium text-sm transition">
                    <i class="ph ph-house text-lg text-gray-400"></i>
                    Inicio
                </a>
                <!-- Elemento Activo: Asistencia -->
                <a href="#" class="flex items-center gap-3 bg-[#0F8241] text-white px-4 py-3 rounded-2xl font-medium text-sm transition shadow-md shadow-green-900/20">
                    <i class="ph-fill ph-calendar-check text-lg"></i>
                    Asistencia
                </a>
                <a href="#" class="flex items-center gap-3 text-gray-600 hover:bg-white/60 px-4 py-3 rounded-2xl font-medium text-sm transition">
                    <i class="ph ph-file-text text-lg text-gray-400"></i>
                    Excusas
                </a>
                <a href="#" class="flex items-center gap-3 text-gray-600 hover:bg-white/60 px-4 py-3 rounded-2xl font-medium text-sm transition">
                    <i class="ph ph-squares-four text-lg text-gray-400"></i>
                    Dashboard
                </a>
                <a href="#" class="flex items-center gap-3 text-gray-600 hover:bg-white/60 px-4 py-3 rounded-2xl font-medium text-sm transition">
                    <i class="ph ph-qr-code text-lg text-gray-400"></i>
                    QR
                </a>
            </nav>
        </div>

        <!-- Perfil Usuario Footer -->
        <div class="p-6 mb-2">
            <div class="flex items-center justify-between gap-3 bg-white/40 p-2 rounded-2xl">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-8 h-8 rounded-full bg-gray-200 flex-shrink-0"></div>
                    <div class="overflow-hidden">
                        <p id="perfil-nombre" class="text-xs font-bold truncate text-gray-900">Samuel david...</p>
                        <p id="perfil-rol" class="text-[10px] text-gray-500">Docente (Usuario)</p>
                    </div>
                </div>
                <div class="flex gap-1 text-gray-400">
                    <button class="p-1.5 hover:text-gray-700 hover:bg-white rounded-lg transition"><i class="ph ph-gear text-sm"></i></button>
                    <button class="p-1.5 hover:text-gray-700 hover:bg-white rounded-lg transition"><i class="ph ph-sign-out text-sm"></i></button>
                </div>
            </div>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 p-10 overflow-y-auto flex flex-col">
        <!-- Encabezado y Selector de Prueba -->
        <div class="flex justify-between items-start mb-6">
            <div>
                <h1 class="text-[28px] tracking-tight font-bold text-gray-900 mb-1">Asistencia</h1>
                <p class="text-sm text-gray-600">Tu historial reciente de marcaje</p>
            </div>

            <!-- SIMULADOR DE ROLES (Solo para propósitos de prueba de la lógica) -->
            <div class="bg-white/80 p-3 rounded-xl border border-white shadow-sm flex items-center gap-3">
                <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">Simular vista como:</label>
                <select id="roleSelector" class="bg-gray-100 border-none text-sm font-medium rounded-lg p-2 outline-none cursor-pointer focus:ring-2 focus:ring-green-500">
                    <option value="usuario">Profesor (Usuario)</option>
                    <option value="moderador">Secretaria (Moderador)</option>
                    <option value="admin">Rector (Administrador)</option>
                </select>
            </div>
        </div>

        <!-- Pestañas (Tabs) -->
        <div class="flex bg-white/50 backdrop-blur-sm p-1 rounded-xl w-max mb-6 border border-white/60 shadow-sm">
            <button class="px-5 py-1.5 text-sm font-medium bg-white rounded-lg shadow-sm text-gray-800">Hoy</button>
            <button class="px-5 py-1.5 text-sm font-medium text-gray-500 hover:text-gray-700 transition">Últimos 30 días</button>
        </div>

        <!-- CONTENEDOR DE ASISTENCIAS DINÁMICO -->
        <div id="contenedor-asistencias" class="max-w-4xl flex flex-col gap-3">
            <!-- Los registros se inyectarán aquí vía JavaScript -->
        </div>
    </main>

    <!-- LÓGICA DE ROLES Y FILTRADO (JAVASCRIPT) -->
    <script>
        // 1. BASE DE DATOS SIMULADA DE ASISTENCIAS
        // Aquí están todos los registros del colegio hoy
        const baseDeDatosAsistencias = [
            { id: 101, ownerId: 1, name: "Samuel David (Tú)", role: "usuario", time: "07:15 AM", status: "Entrada" },
            { id: 102, ownerId: 2, name: "María Fernanda", role: "usuario", time: "07:22 AM", status: "Entrada" },
            { id: 103, ownerId: 3, name: "Carlos López", role: "usuario", time: "07:30 AM", status: "Entrada" },
            { id: 104, ownerId: 4, name: "Secretaria Elena", role: "moderador", time: "06:45 AM", status: "Entrada" },
            { id: 105, ownerId: 5, name: "Rector Alfonso", role: "admin", time: "06:30 AM", status: "Entrada" }
        ];

        // 2. FUNCIÓN PRINCIPAL DE FILTRADO
        function renderizarAsistencias() {
            const roleSeleccionado = document.getElementById('roleSelector').value;
            const contenedor = document.getElementById('contenedor-asistencias');
            const perfilNombre = document.getElementById('perfil-nombre');
            const perfilRol = document.getElementById('perfil-rol');
            
            let datosFiltrados = [];

            // APLICACIÓN DE LAS REGLAS DE NEGOCIO SOLICITADAS:
            
            if (roleSeleccionado === 'usuario') {
                // REGLA 1: Solo ve sus propias asistencias (Ej. Asumimos que el usuario actual es ID: 1)
                datosFiltrados = baseDeDatosAsistencias.filter(registro => registro.ownerId === 1);
                perfilNombre.innerText = "Samuel david...";
                perfilRol.innerText = "Docente (Usuario)";
            } 
            else if (roleSeleccionado === 'moderador') {
                // REGLA 2: Ve las de usuarios y las de moderadores (incluyéndose). Ignora las del admin.
                datosFiltrados = baseDeDatosAsistencias.filter(registro => 
                    registro.role === 'usuario' || registro.role === 'moderador'
                );
                perfilNombre.innerText = "Elena Gómez";
                perfilRol.innerText = "Secretaria (Moderador)";
            } 
            else if (roleSeleccionado === 'admin') {
                // REGLA 3: Ve absolutamente todo.
                datosFiltrados = baseDeDatosAsistencias;
                perfilNombre.innerText = "Alfonso Pérez";
                perfilRol.innerText = "Rector (Admin)";
            }

            // 3. RENDERIZADO EN PANTALLA (HTML DINÁMICO)
            contenedor.innerHTML = ''; // Limpiar contenedor

            if (datosFiltrados.length === 0) {
                // Estado vacío (Idéntico a la imagen original cuando no hay datos)
                contenedor.innerHTML = `
                    <div class="bg-white/90 backdrop-blur-sm rounded-2xl px-5 py-4 border border-white text-gray-500 text-[13px] shadow-sm">
                        Tu registro de hoy aparecerá aquí cuando marques entrada
                    </div>
                `;
            } else {
                // Mostrar lista
                datosFiltrados.forEach(registro => {
                    // Diseño visual según el rol de la tarjeta para identificar fácilmente
                    let badgeColor = registro.role === 'admin' ? 'bg-purple-100 text-purple-700' : 
                                     registro.role === 'moderador' ? 'bg-blue-100 text-blue-700' : 
                                     'bg-gray-100 text-gray-600';
                                     
                    const htmlRegistro = `
                        <div class="bg-white/90 backdrop-blur-sm rounded-2xl p-4 border border-white flex justify-between items-center shadow-sm hover:shadow-md transition card-shadow">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-500">
                                    <i class="ph-fill ph-user"></i>
                                </div>
                                <div>
                                    <p class="font-bold text-sm text-gray-900">${registro.name}</p>
                                    <div class="flex items-center gap-2 mt-0.5">
                                        <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full ${badgeColor}">
                                            ${registro.role}
                                        </span>
                                        <span class="text-xs text-gray-400 font-medium">Marcó a las ${registro.time}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 bg-[#e6f4eb] text-[#0F8241] px-4 py-2 rounded-xl font-bold text-xs">
                                <i class="ph-bold ph-arrow-right"></i>
                                ${registro.status}
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += htmlRegistro;
                });
            }
        }

        // 4. EVENT LISTENERS
        // Escuchar cuando el usuario cambia el rol en el select
        document.getElementById('roleSelector').addEventListener('change', renderizarAsistencias);

        // Renderizar por primera vez al cargar la página
        renderizarAsistencias();
    </script>
</body>
</html>
