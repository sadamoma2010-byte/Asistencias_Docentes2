    <!-- ===================================================== -->
    <!-- JAVASCRIPT -->
    <!-- ===================================================== -->

    <script>


        /*
        ==========================================================
        CONFIGURACIÓN TEMPORAL
        ==========================================================

        IMPORTANTE:

        ESTA PÁGINA TODAVÍA NO ESTÁ CONECTADA
        A LA BASE DE DATOS.

        Estos datos solamente permiten probar
        el diseño de la pantalla.

        POSTERIORMENTE ESTA VARIABLE SERÁ
        REEMPLAZADA POR LA INFORMACIÓN REAL
        DE POSTGRESQL.

        ==========================================================
        */


        let datosAsistencias = [];



        /*
        ==========================================================
        USUARIO ACTUAL
        ==========================================================

        ESTA ESTRUCTURA ESTÁ PREPARADA PARA
        RECIBIR EL USUARIO REAL.

        Posteriormente:

        usuarioActual.nombre
        usuarioActual.apellido
        usuarioActual.rol
        usuarioActual.id

        vendrán desde el sistema de autenticación.

        ==========================================================
        */

        let usuarioActual = {

            id: null,

            nombre: "Usuario",

            apellido: "",

            rol: "DOCENTE"

        };



        /*
        ==========================================================
        PERÍODO ACTUAL
        ==========================================================
        */

        let periodoActual = "hoy";



        /*
        ==========================================================
        ELEMENTOS HTML
        ==========================================================
        */

        const contenedor =
            document.getElementById(
                "contenedor-asistencias"
            );


        const perfilNombre =
            document.getElementById(
                "perfil-nombre"
            );


        const perfilRol =
            document.getElementById(
                "perfil-rol"
            );


        const btnHoy =
            document.getElementById(
                "btn-hoy"
            );


        const btn30Dias =
            document.getElementById(
                "btn-30-dias"
            );



        /*
        ==========================================================
        FECHA ACTUAL
        ==========================================================

        Posteriormente estas fechas servirán
        para consultar:

        asistencias.fecha

        ==========================================================
        */

        function obtenerFechaActual() {

            const fecha =
                new Date();

            const año =
                fecha.getFullYear();

            const mes =
                String(
                    fecha.getMonth() + 1
                ).padStart(2, "0");

            const dia =
                String(
                    fecha.getDate()
                ).padStart(2, "0");

            return `${año}-${mes}-${dia}`;

        }



        /*
        ==========================================================
        FECHA HACE 30 DÍAS
        ==========================================================
        */

        function obtenerFechaHace30Dias() {

            const fecha =
                new Date();

            fecha.setDate(
                fecha.getDate() - 30
            );


            const año =
                fecha.getFullYear();


            const mes =
                String(
                    fecha.getMonth() + 1
                ).padStart(2, "0");


            const dia =
                String(
                    fecha.getDate()
                ).padStart(2, "0");


            return `${año}-${mes}-${dia}`;

        }



        /*
        ==========================================================
        FORMATEAR HORA
        ==========================================================
        */

        function formatearHora(
            hora
        ) {

            if (!hora) {
                return "--:--";
            }


            /*
                preparado para:

                asistencias.registrado_en
            */

            const fecha =
                new Date(hora);


            return fecha.toLocaleTimeString(
                "es-CO",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: true
                }
            );

        }



        /*
        ==========================================================
        TEXTO DEL ESTADO
        ==========================================================
        */

        function obtenerTextoEstado(
            estado
        ) {

            switch (estado) {

                case "A_TIEMPO":

                    return "A tiempo";


                case "TARDE":

                    return "Tarde";


                case "SALIDA_ANTICIPADA":

                    return "Salida anticipada";


                default:

                    return estado ||
                        "Sin estado";

            }

        }



        /*
        ==========================================================
        COLOR DEL ESTADO
        ==========================================================
        */

        function obtenerColorEstado(
            estado
        ) {

            switch (estado) {

                case "A_TIEMPO":

                    return `
                        bg-green-100
                        text-green-700
                    `;


                case "TARDE":

                    return `
                        bg-orange-100
                        text-orange-700
                    `;


                case "SALIDA_ANTICIPADA":

                    return `
                        bg-red-100
                        text-red-700
                    `;


                default:

                    return `
                        bg-gray-100
                        text-gray-600
                    `;

            }

        }



        /*
        ==========================================================
        TEXTO DEL TIPO
        ==========================================================
        */

        function obtenerTextoTipo(
            tipo
        ) {

            switch (tipo) {

                case "ENTRADA":

                    return "Entrada";


                case "SALIDA":

                    return "Salida";


                default:

                    return tipo ||
                        "Marcación";

            }

        }



        /*
        ==========================================================
        ICONO DEL TIPO
        ==========================================================
        */

        function obtenerIconoTipo(
            tipo
        ) {

            if (
                tipo === "SALIDA"
            ) {

                return "ph-arrow-left";

            }


            return "ph-arrow-right";

        }



        /*
        ==========================================================
        ESCAPAR HTML
        ==========================================================

        Se deja desde ahora para que los datos
        provenientes de la BD no se inserten
        directamente como HTML.

        ==========================================================
        */

        function escaparHTML(
            texto
        ) {

            if (
                texto === null ||
                texto === undefined
            ) {

                return "";

            }


            return String(texto)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        /*
        ==========================================================
        RENDERIZAR ASISTENCIAS
        ==========================================================

        ESTA FUNCIÓN YA ESTÁ PREPARADA PARA
        LOS CAMPOS DE LA BASE DE DATOS.

        ==========================================================
        */

        function renderizarAsistencias(
            datos
        ) {

            contenedor.innerHTML = "";


            /*
            ------------------------------------------------------
            SIN REGISTROS
            ------------------------------------------------------
            */

            if (
                datos.length === 0
            ) {

                contenedor.innerHTML = `

                    <div
                        class="
                            bg-white/90
                            backdrop-blur-sm
                            rounded-2xl
                            px-5
                            py-4
                            border
                            border-white
                            text-gray-500
                            text-[13px]
                            shadow-sm
                        "
                    >

                        Tu registro de hoy
                        aparecerá aquí
                        cuando marques entrada.

                    </div>

                `;

                return;

            }



            /*
            ------------------------------------------------------
            REGISTROS
            ------------------------------------------------------
            */

            datos.forEach(
                registro => {


                    /*
                    ==================================================
                    CAMPOS PREPARADOS PARA LA BD
                    ==================================================

                    registro.id
                    registro.docente_id
                    registro.fecha
                    registro.registrado_en
                    registro.tipo
                    registro.estado
                    registro.hora_esperada
                    registro.diferencia_minutos
                    registro.docente
                    registro.jornada
                    registro.asignatura

                    ==================================================
                    */


                    const nombreDocente =
                        registro.docente ||
                        "Docente";


                    const estado =
                        obtenerTextoEstado(
                            registro.estado
                        );


                    const colorEstado =
                        obtenerColorEstado(
                            registro.estado
                        );


                    const tipo =
                        obtenerTextoTipo(
                            registro.tipo
                        );


                    const icono =
                        obtenerIconoTipo(
                            registro.tipo
                        );


                    const hora =
                        formatearHora(
                            registro.registrado_en
                        );


                    /*
                    --------------------------------------------------
                    DIFERENCIA
                    --------------------------------------------------
                    */

                    let detalle = "";


                    if (
                        registro.estado === "TARDE"
                        &&
                        Number(
                            registro.diferencia_minutos
                        ) > 0
                    ) {

                        detalle =
                            `${registro.diferencia_minutos} minutos tarde`;

                    }



                    /*
                    --------------------------------------------------
                    TARJETA
                    --------------------------------------------------
                    */

                    const tarjeta = `

                        <div
                            class="
                                bg-white/90
                                backdrop-blur-sm
                                rounded-2xl
                                p-4
                                border
                                border-white
                                flex
                                justify-between
                                items-center
                                shadow-sm
                                hover:shadow-md
                                transition
                                card-shadow
                            "
                        >


                            <!-- INFORMACIÓN -->

                            <div
                                class="
                                    flex
                                    items-center
                                    gap-4
                                "
                            >


                                <!-- ICONO USUARIO -->

                                <div
                                    class="
                                        w-10
                                        h-10
                                        rounded-full
                                        bg-gray-200
                                        flex
                                        items-center
                                        justify-center
                                        text-gray-500
                                        flex-shrink-0
                                    "
                                >

                                    <i
                                        class="
                                            ph-fill
                                            ph-user
                                        "
                                    ></i>

                                </div>



                                <!-- DATOS -->

                                <div>

                                    <p
                                        class="
                                            font-bold
                                            text-sm
                                            text-gray-900
                                        "
                                    >
                                        ${escaparHTML(
                                            nombreDocente
                                        )}
                                    </p>


                                    <div
                                        class="
                                            flex
                                            items-center
                                            gap-2
                                            mt-0.5
                                            flex-wrap
                                        "
                                    >


                                        <!-- ESTADO -->

                                        <span
                                            class="
                                                text-[10px]
                                                uppercase
                                                font-bold
                                                px-2
                                                py-0.5
                                                rounded-full
                                                ${colorEstado}
                                            "
                                        >
                                            ${estado}
                                        </span>



                                        <!-- HORA -->

                                        <span
                                            class="
                                                text-xs
                                                text-gray-400
                                                font-medium
                                            "
                                        >
                                            ${tipo}
                                            ·
                                            ${hora}
                                        </span>



                                        <!-- JORNADA -->

                                        ${
                                            registro.jornada
                                            ?
                                            `
                                                <span
                                                    class="
                                                        text-xs
                                                        text-gray-400
                                                    "
                                                >
                                                    ·
                                                    ${escaparHTML(
                                                        registro.jornada
                                                    )}
                                                </span>
                                            `
                                            :
                                            ""
                                        }



                                        <!-- ASIGNATURA -->

                                        ${
                                            registro.asignatura
                                            ?
                                            `
                                                <span
                                                    class="
                                                        text-xs
                                                        text-gray-400
                                                    "
                                                >
                                                    ·
                                                    ${escaparHTML(
                                                        registro.asignatura
                                                    )}
                                                </span>
                                            `
                                            :
                                            ""
                                        }

                                    </div>



                                    <!-- DIFERENCIA -->

                                    ${
                                        detalle
                                        ?
                                        `
                                            <p
                                                class="
                                                    text-[11px]
                                                    text-orange-500
                                                    font-medium
                                                    mt-1
                                                "
                                            >
                                                ${detalle}
                                            </p>
                                        `
                                        :
                                        ""
                                    }

                                </div>

                            </div>



                            <!-- TIPO -->

                            <div
                                class="
                                    flex
                                    items-center
                                    gap-2
                                    bg-[#e6f4eb]
                                    text-[#0F8241]
                                    px-4
                                    py-2
                                    rounded-xl
                                    font-bold
                                    text-xs
                                "
                            >

                                <i
                                    class="
                                        ph-bold
                                        ${icono}
                                    "
                                ></i>

                                ${tipo}

                            </div>

                        </div>

                    `;


                    contenedor.innerHTML +=
                        tarjeta;

                }
            );

        }



        /*
        ==========================================================
        CAMBIAR TAB
        ==========================================================
        */

        function cambiarTab(
            periodo
        ) {

            periodoActual =
                periodo;


            /*
            ------------------------------------------------------
            TAB HOY
            ------------------------------------------------------
            */

            if (
                periodo === "hoy"
            ) {

                btnHoy.classList.add(
                    "bg-white",
                    "shadow-sm",
                    "text-gray-800"
                );

                btnHoy.classList.remove(
                    "text-gray-500"
                );


                btn30Dias.classList.remove(
                    "bg-white",
                    "shadow-sm",
                    "text-gray-800"
                );

                btn30Dias.classList.add(
                    "text-gray-500"
                );

            }



            /*
            ------------------------------------------------------
            TAB 30 DÍAS
            ------------------------------------------------------
            */

            else {

                btn30Dias.classList.add(
                    "bg-white",
                    "shadow-sm",
                    "text-gray-800"
                );

                btn30Dias.classList.remove(
                    "text-gray-500"
                );


                btnHoy.classList.remove(
                    "bg-white",
                    "shadow-sm",
                    "text-gray-800"
                );

                btnHoy.classList.add(
                    "text-gray-500"
                );

            }


            /*
            ======================================================
            AQUÍ SE CONECTARÁ POSTERIORMENTE LA BD
            ======================================================

            Para "hoy":

            fechaInicio = fecha actual
            fechaFin    = fecha actual


            Para "30 días":

            fechaInicio = fecha actual - 30 días
            fechaFin    = fecha actual


            ======================================================
            */


            cargarDatos();

        }



        /*
        ==========================================================
        CARGAR DATOS
        ==========================================================

        POR AHORA:

        No consulta ninguna BD.

        Cuando hagamos la conexión real,
        esta será la función que recibirá
        los registros desde PostgreSQL.

        ==========================================================
        */

        function cargarDatos() {


            /*
            ======================================================
            IMPORTANTE
            ======================================================

            TEMPORALMENTE NO HAY DATOS.

            Cuando conectemos PostgreSQL,
            esta función será reemplazada por:

                fetch(...)
                ↓
                API
                ↓
                PostgreSQL
                ↓
                asistencias
                ↓
                renderizarAsistencias(...)

            ======================================================
            */


            datosAsistencias = [];


            renderizarAsistencias(
                datosAsistencias
            );

        }



        /*
        ==========================================================
        BOTÓN HOY
        ==========================================================
        */

        btnHoy.addEventListener(
            "click",
            function() {

                cambiarTab(
                    "hoy"
                );

            }
        );



        /*
        ==========================================================
        BOTÓN 30 DÍAS
        ==========================================================
        */

        btn30Dias.addEventListener(
            "click",
            function() {

                cambiarTab(
                    "30dias"
                );

            }
        );



        /*
        ==========================================================
        INICIALIZAR PERFIL
        ==========================================================

        TEMPORALMENTE:

        Los datos son de ejemplo.

        Cuando conectemos la BD,
        se reemplazarán automáticamente.

        ==========================================================
        */

        function cargarPerfilTemporal() {

            perfilNombre.innerText =
                `${usuarioActual.nombre} ${usuarioActual.apellido}`
                    .trim();


            perfilRol.innerText =
                usuarioActual.rol;

        }



        /*
        ==========================================================
        INICIO
        ==========================================================
        */

        cargarPerfilTemporal();

        cargarDatos();


    </script>

</body>

</html>
