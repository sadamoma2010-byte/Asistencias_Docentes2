<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>Excusas - Asistencia Docente</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Inter -->

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body class="min-h-screen bg-gradient-to-br from-[#dcfce7] via-[#f0fdf4] to-[#d8f9e2] text-gray-800 antialiased selection:bg-emerald-200">

  <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
  <header class="w-full bg-white/70 backdrop-blur-md border-b border-white/60 px-4 md:px-8 py-3 flex items-center justify-between sticky top-0 z-50">
    <!-- Logo y Título -->
    <div class="flex items-center gap-3">
      <div class="bg-emerald-600 text-white p-2 rounded-xl shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />

      </div>

        <p class="text-[10px] text-gray-500 mt-0.5">Control Inteligente • Colombia</p>
      </div>
    </div>

    <!-- Menú Central -->
    <nav class="hidden md:flex items-center bg-gray-100/80 p-1 rounded-full border border-gray-200/60 text-xs font-medium">
      <a href="inicio.html" class="flex items-center gap-1.5 px-4 py-1.5 rounded-full text-gray-600 hover:text-gray-900 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        Inicio
      </a>
      <a href="asistencias.html" class="flex items-center gap-1.5 px-4 py-1.5 rounded-full text-gray-600 hover:text-gray-900 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Asistencia
      </a>
      <!-- Pestaña Activa: Excusas -->
      <a href="excusas.html" class="flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-emerald-600 text-white shadow-sm font-semibold transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Excusas

      <a href="dashboard.html" class="flex items-center gap-1.5 px-4 py-1.5 rounded-full text-gray-600 hover:text-gray-900 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>

        QR
      </a>

    <!-- Usuario y Acciones -->
    <div class="flex items-center gap-3">
      <div class="text-right hidden sm:block">
        <p class="text-xs font-bold text-gray-900 leading-none">Samuel david morales maldonado</p>
        <p class="text-[10px] text-gray-500 mt-0.5">Docente</p>
      </div>
      <button class="p-1.5 text-gray-600 hover:text-gray-900 rounded-full hover:bg-black/5 transition" aria-label="Cambiar tema">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
      <button class="p-1.5 text-gray-600 hover:text-red-600 rounded-full hover:bg-black/5 transition" aria-label="Cerrar sesión">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-6xl mx-auto px-4 md:px-8 py-8">
    
    <!-- Encabezado de Sección con Botón de Acción -->
    <div class="flex items-start justify-between gap-4 mb-6">
      <div>
        <h2 class="text-2xl font-extrabold text-gray-900">Excusas</h2>
        <p class="text-xs text-gray-500 mt-1">Justificaciones médicas, administrativas o personales con soporte adjunto.</p>
      </div>
      
      <!-- Botón Nueva Excusa -->
      <button class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs px-4 py-2 rounded-full shadow-md shadow-emerald-700/20 active:scale-95 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        Nueva excusa
      </button>
    </div>

    <!-- Tarjeta de Estado Vacío -->
    <section class="w-full bg-white/80 backdrop-blur-md rounded-3xl py-14 px-6 border border-white/80 shadow-xl shadow-emerald-950/5 flex flex-col items-center justify-center text-center">

      <div class="p-3 bg-emerald-50 text-emerald-700 rounded-2xl border border-emerald-100/60 mb-3">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />

      </div>
      <!-- Texto informativo -->
      <p class="text-xs text-gray-500 font-medium">
        Aún no has registrado excusas.
      </p>
    </section>
