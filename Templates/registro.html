<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta de docente - Asistencia Docente</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#dcfce7] via-[#f0fdf4] to-[#dcfce7] flex items-center justify-center p-4 relative selection:bg-emerald-200">

  <!-- Botón de Modo Oscuro / Claro (Esquina superior derecha) -->
  <button class="absolute top-6 right-6 p-2 text-gray-600 hover:text-gray-900 rounded-full hover:bg-black/5 transition" aria-label="Cambiar tema">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
    </svg>
  </button>

  <!-- Tarjeta de Registro -->
  <main class="w-full max-w-sm bg-white/80 backdrop-blur-md p-7 rounded-3xl border border-white/80 shadow-xl shadow-emerald-950/5">
    
    <!-- Encabezado con Icono -->
    <div class="flex items-center gap-3 mb-6">
      <div class="bg-emerald-600 text-white p-2.5 rounded-xl shadow-sm shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 15l2 2 4-4" />
        </svg>
      </div>
      <div>
        <h1 class="text-base font-bold text-gray-900 leading-tight">Crear cuenta de docente</h1>
        <p class="text-xs text-gray-500 mt-0.5">Empieza a registrar tu asistencia hoy</p>
      </div>
    </div>

    <!-- Formulario -->
    <form action="#" method="POST" class="space-y-3.5">
      
      <!-- Nombre completo -->
      <div>
        <label for="nombre" class="block text-xs font-medium text-gray-700 mb-1">Nombre completo</label>
        <input 
          type="text" 
          id="nombre" 
          name="nombre" 
          required 
          class="w-full px-3 py-2 bg-white/70 border border-gray-200 rounded-xl text-xs text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
        />
      </div>

      <!-- Cédula y Jornada (2 columnas) -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="cedula" class="block text-xs font-medium text-gray-700 mb-1">Cédula</label>
          <input 
            type="text" 
            id="cedula" 
            name="cedula" 
            required 
            class="w-full px-3 py-2 bg-white/70 border border-gray-200 rounded-xl text-xs text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
          />
        </div>

        <div>
          <label for="jornada" class="block text-xs font-medium text-gray-700 mb-1">Jornada</label>
          <div class="relative">
            <select 
              id="jornada" 
              name="jornada" 
              class="w-full px-3 py-2 bg-white/70 border border-gray-200 rounded-xl text-xs text-gray-800 appearance-none focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition pr-8"
            >
              <option value="completa" selected>Completa</option>
              <option value="manana">Mañana</option>
              <option value="tarde">Tarde</option>
              <option value="nocturna">Nocturna</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-gray-400">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-xs font-medium text-gray-700 mb-1">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required 
          class="w-full px-3 py-2 bg-white/70 border border-gray-200 rounded-xl text-xs text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
        />
      </div>

      <!-- Contraseña -->
      <div>
        <label for="password" class="block text-xs font-medium text-gray-700 mb-1">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          class="w-full px-3 py-2 bg-white/70 border border-gray-200 rounded-xl text-xs text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
        />
      </div>

      <!-- Botón Crear cuenta -->
      <button 
        type="submit" 
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-full text-xs transition shadow-md shadow-emerald-600/20 mt-2"
      >
        Crear cuenta
      </button>

    </form>

    <!-- Separador 'o' -->
    <div class="relative my-4 flex items-center justify-center">
      <div class="border-t border-gray-200 w-full"></div>
      <span class="absolute bg-white/90 px-1.5 text-[10px] text-gray-400 rounded-full border border-gray-200">o</span>
    </div>

    <!-- Registrarse con Google -->
    <button 
      type="button" 
      class="w-full bg-white/80 hover:bg-white text-gray-700 font-medium py-2 px-4 rounded-full border border-gray-200 text-xs flex items-center justify-center gap-2 shadow-sm transition"
    >
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Registrarse con Google</span>
    </button>

    <!-- Footer link -->
    <p class="text-center text-xs text-gray-500 mt-5">
      ¿Ya tienes cuenta? <a href="templates/iniciar.html" class="text-emerald-600 font-semibold hover:underline">Inicia sesión</a>
    </p>

  </main>

</body>
</html>
